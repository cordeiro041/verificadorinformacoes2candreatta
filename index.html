<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Confere IA</title>
</head>
<body>

    <header class="cabecalho">
        <h1>Confere IA</h1>
        <nav>
            <a href="#">Início</a>
        </nav>
    </header>

    <main>
        <h2>Descubra a verdade passando o mouse</h2>

        <article class="cartao">
            <div class="cartao-interno">
                <!-- Frente do Cartão -->
                <div class="cartao-frente">
                    <img src="https://static.nationalgeographicbrasil.com/files/styles/image_3200/public/mm1012723121410486.jpg?w=1900&h=2849" alt="Pinguim na frente" class="cartao-imagem">
                    <p>Pinguins conseguem voar como pássaros?</p>
                </div>

                <!-- Verso do Cartão -->
                <div class="cartao-verso">
                    <img src="https://midias.correiobraziliense.com.br/_midias/jpg/2025/10/07/675x450/1_shutterstock_2675800515-59562091.jpg?20251007110105" alt="Pinguim no verso" class="cartao-imagem">
                    <p><strong>Mito!</strong> Pinguins não voam no ar, mas são excelentes nadadores.</p>
                </div>
            </div>
        </article>
    </main>

    <footer>
        <p>❤️‍🔥 projeto alice ❤️‍🔥</p>
    </footer>

</body>
</html>
